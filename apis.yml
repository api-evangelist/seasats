name: Seasats
description: >-
  Seasats designs and manufactures autonomous uncrewed surface vehicles (USVs)
  for ocean intelligence, maritime domain awareness, and defense missions. Its
  platform lines include the hand-deployable Lightfish (6-month endurance), the
  fast-response Quickfish (35+ knots with an integrated drone bay), and the
  heavy-payload Heavyfish. Vessels carry modular payloads, run persistent
  autonomous surveys, and integrate with existing command-and-control (C2)
  architectures. Seasats is a Techstars-backed company. As of this enrichment
  pass Seasats publishes no public developer API, SDK, documentation portal, or
  machine-readable discovery surface; its integration story is C2
  interoperability, not a web API.
